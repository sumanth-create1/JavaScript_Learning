<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>JavaScript</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎓 Student CGPA Calculator</h1>
        <p>
          Enter your subject grades and credits to instantly calculate CGPA and
          Percentage.
        </p>
      </header>

      <!-- Main Dashboard Split Layout -->
      <div class="dashboard-layout">
        <!-- Left Column: Input Form -->
        <div class="card form-card">
          <h2>Add New Course</h2>
          <form id="course-form">
            <div class="form-group">
              <label for="course-name">Course Name / Subject</label>
              <input
                type="text"
                id="course-name"
                placeholder="e.g., Mathematics, Data Structures"
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="course-credit">Credits</label>
                <input
                  type="number"
                  id="course-credit"
                  min="1"
                  max="30"
                  placeholder="e.g., 4"
                  required
                />
              </div>

              <div class="form-group">
                <label for="course-grade">Letter Grade</label>
                <select id="course-grade" required>
                  <option value="" disabled selected>Select Grade</option>
                  <option value="O">O (Outstanding - 10)</option>
                  <option value="A+">A+ (Excellent - 9)</option>
                  <option value="A">A (Very Good - 8)</option>
                  <option value="B+">B+ (Good - 7)</option>
                  <option value="B">B (Above Average - 6)</option>
                  <option value="F">F (Fail - 0)</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn-primary">Add Course</button>
          </form>
        </div>

        <!-- Right Column: Summary & Analytics -->
        <div class="results-column">
          <!-- Big Metrics Cards -->
          <div class="metrics-grid">
            <div class="metric-card score-card">
              <h3>Cumulative CGPA</h3>
              <p id="display-cgpa">0.00</p>
            </div>
            <div class="metric-card percent-card">
              <h3>Equivalent Percentage</h3>
              <p id="display-percentage">0.0%</p>
            </div>
          </div>

          <!-- Course Track Sheet Table -->
          <div class="card table-card">
            <h2>Added Courses</h2>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Course</th>
                    <th>Credits</th>
                    <th>Grade</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="course-table-body">
                  <!-- Dynamic rows will be inserted here by JavaScript -->
                  <tr id="empty-row">
                    <td colspan="4" class="text-muted">
                      No courses added yet. Use the form on the left.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
