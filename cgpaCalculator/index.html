<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CGPA CALCULATOR</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>CGPA CALCULATOR</h1>
        <p>Calculate your result</p>
      </header>

      <main>
        <section class="calculator-area">
          <!-- Input section -->

          <div class="input-section">
            <h2>Add Subject</h2>

            <!-- Subject -->

            <div class="input-group">
              <label for="subject"> Subject </label>

              <input type="text" id="subject" placeholder="Enter Subject" />
            </div>

            <div class="input-group">
              <label for="credit"> Credits </label>

              <input
                type="number"
                id="credits"
                placeholder="Enter credit"
                min="1"
              />
            </div>

            <div class="input-group">
              <label for="grade"> Grade </label>

              <select id="grade">
                <option value="">Select Grade</option>
                <option value="10">O</option>
                <option value="9">A+</option>
                <option value="8">A</option>
                <option value="7">B+</option>
                <option value="6">B</option>
                <option value="5">C</option>
                <option value="4">P</option>
                <option value="0">F</option>
              </select>
            </div>

            <!-- Add Subject Button -->

            <button type="button" id="addSubject">Add Subject</button>
          </div>

          <!-- Table Section -->

          <div class="table-section">
            <h2>Subjects</h2>

            <table>
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Credit</th>
                  <th>Grade</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="subjectTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="calculate-section">
          <button type="button" id="calculateCGPA">Calculate CGPA</button>
        </section>

        <!-- Result Section -->

        <section class="result-section">
          <h2>Result</h2>

          <div class="result-value">
            <span id="cgpaResult"> 0.00 </span>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
